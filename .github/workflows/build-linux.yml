name: Build Linux (Portable + Installer)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app (AppImage portable + .deb installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Habitt. v__VERSION__'
          releaseBody: |
            ## Habitt. v__VERSION__
            
            ### Linux Downloads
            - **Habitt.AppImage** — Portable (no installation required)
            - **habitt_amd64.deb** — Debian/Ubuntu installer
            
            ### Installation
            - **AppImage:** `chmod +x Habitt.AppImage && ./Habitt.AppImage`
            - **Debian/Ubuntu:** `sudo dpkg -i habitt_amd64.deb`
          releaseDraft: true
          prerelease: false
          args: '--bundles appimage deb'

      - name: Upload AppImage artifact (portable)
        uses: actions/upload-artifact@v4
        with:
          name: Habitt-Linux-Portable-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload .deb artifact (installer)
        uses: actions/upload-artifact@v4
        with:
          name: Habitt-Linux-Installer-Deb
          path: src-tauri/target/release/bundle/deb/*.deb
