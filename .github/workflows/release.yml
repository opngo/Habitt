name: Release installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows (NSIS installer + MSI)
          - platform: ubuntu-22.04
            label: Linux (AppImage + .deb)
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Habitt ${{ github.ref_name }}'
          releaseBody: |
            ## Habitt.

            A beautiful, privacy-first habit tracker. All data stays on your device.

            - **Windows:** NSIS installer (and MSI)
            - **Linux:** AppImage (portable — `chmod +x` and run) and `.deb`

            Also works in any browser: `npm run dev` / open the `habitt-web` artifact.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
