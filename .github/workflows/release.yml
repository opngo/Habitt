name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: Linux
            bundles: appimage,deb
            rust-target: ''
          - platform: windows-latest
            name: Windows
            bundles: nsis
            rust-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: "Habitt. ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            ## Habitt. 🎉

            A beautiful, privacy-first desktop habit tracker with heatmaps, journaling, and streaks.
            All data is stored locally in SQLite — no cloud, no tracking, no ads.

            ### Downloads
            - **Windows** — `Habitt_*_x64-setup.exe` (NSIS installer)
            - **Linux** — `Habitt_*_amd64.AppImage` (portable, no install required)
            - **Linux** — `habitt_*_amd64.deb` (Debian/Ubuntu installer)

            ### Install
            - **Windows:** run the `.exe` installer and follow the wizard
            - **AppImage:** `chmod +x Habitt_*_amd64.AppImage && ./Habitt_*_amd64.AppImage`
            - **Debian/Ubuntu:** `sudo dpkg -i habitt_*_amd64.deb`

            ### Notes
            - Built from tag `__VERSION__` via GitHub Actions (Tauri 2)
            - Unsigned binaries — Windows SmartScreen may show a warning on first run
          releaseDraft: false
          prerelease: false
          args: '--bundles ${{ matrix.bundles }}'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: habitt-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
